- name: Assert development bootstrap context
  hosts: local
  gather_facts: false
  vars_files:
    - ../../ansible/profiles/dev.yml
  tasks:
    - name: Load the configured common role path
      ansible.builtin.include_role:
        name: common

    - name: Assert development profile inputs
      ansible.builtin.assert:
        that:
          - dotfiles_profile_name == expected_profile
          - dotfiles_root is directory
          - dotfiles_home is directory
          - dotfiles_platform_name == 'arch'
          - cli_tools_packages is sequence
          - development_packages is sequence
          - terminal_packages is sequence
          - shell_packages is sequence
          - desktop_hyprland_packages is sequence
          - desktop_session_packages is sequence
          - desktop_shell_packages is sequence
          - desktop_actions_packages is sequence
          - "'cli_tools' in profile_roles"
          - cli_tools_link_mappings | length == 3
          - "'shell_zsh' in profile_roles"
          - shell_zsh_packages | length == 0
          - "'development' in profile_roles"
          - development_packages | length == 0
