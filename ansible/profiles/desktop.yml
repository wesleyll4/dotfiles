dotfiles_profile_name: desktop
profile_roles:
  - common
  - cli_tools
  - shell_zsh
  - terminal_kitty
  - desktop_session_current
  - desktop_shell_current
  - desktop_actions_current

cli_tools_link_mappings:
  - target: "{{ dotfiles_home }}/.config/starship.toml"
    expected_source: "{{ dotfiles_root }}/config/user/starship/starship.toml"
    legacy_sources: []
  - target: "{{ dotfiles_home }}/.config/mise/config.toml"
    expected_source: "{{ dotfiles_root }}/config/user/mise/config.toml"
    legacy_sources: []
  - target: "{{ dotfiles_home }}/.config/yazi/keymap.toml"
    expected_source: "{{ dotfiles_root }}/config/user/yazi/keymap.toml"
    legacy_sources: []

shell_zsh_expected_source: "{{ dotfiles_root }}/config/user/zsh/.zshrc"
shell_zsh_legacy_sources: []
shell_zsh_packages: []

terminal_kitty_packages: []
terminal_kitty_entries:
  - name: "One Dark.conf"
    expected_source: "{{ dotfiles_root }}/config/user/kitty/One Dark.conf"
    legacy_sources: []
  - name: current-theme.conf
    expected_source: "{{ dotfiles_root }}/config/user/kitty/current-theme.conf"
    legacy_sources: []
  - name: kitty.conf
    expected_source: "{{ dotfiles_root }}/config/user/kitty/kitty.conf"
    legacy_sources: []
  - name: kitty.conf.bak
    expected_source: "{{ dotfiles_root }}/config/user/kitty/kitty.conf.bak"
    legacy_sources: []

desktop_session_current_link_mappings:
  - target: "{{ dotfiles_home }}/.config/hypr/hypridle.conf"
    expected_source: "{{ dotfiles_root }}/config/user/hypr/candidate/session/current/hypridle.conf"
    legacy_sources: []
  - target: "{{ dotfiles_home }}/.config/hypr/hyprlock.conf"
    expected_source: "{{ dotfiles_root }}/config/user/hypr/candidate/session/current/hyprlock.conf"
    legacy_sources: []

desktop_actions_current_link_mappings:
  - target: "{{ dotfiles_home }}/.config/hypr/scripts"
    expected_source: "{{ dotfiles_root }}/config/user/hypr/candidate/actions/current/scripts"
    legacy_sources: []

desktop_shell_current_link_mappings:
  - target: "{{ dotfiles_home }}/.config/walker"
    expected_source: "{{ dotfiles_root }}/config/user/desktop-shell/current/walker"
    legacy_sources: []
  - target: "{{ dotfiles_home }}/.config/elephant/menus"
    expected_source: "{{ dotfiles_root }}/config/user/desktop-shell/current/elephant/menus"
    legacy_sources: []

desktop_shell_current_directory_entries:
  - target: "{{ dotfiles_home }}/.config/waybar/config.jsonc"
    expected_source: "{{ dotfiles_root }}/config/user/desktop-shell/current/waybar/config.jsonc"
  - target: "{{ dotfiles_home }}/.config/waybar/config.jsonc.bkp"
    expected_source: "{{ dotfiles_root }}/config/user/desktop-shell/current/waybar/config.jsonc.bkp"
  - target: "{{ dotfiles_home }}/.config/waybar/style.css"
    expected_source: "{{ dotfiles_root }}/config/user/desktop-shell/current/waybar/style.css"
  - target: "{{ dotfiles_home }}/.config/waybar/style.css.bkp"
    expected_source: "{{ dotfiles_root }}/config/user/desktop-shell/current/waybar/style.css.bkp"
  - target: "{{ dotfiles_home }}/.config/elephant/desktopapplications.toml"
    expected_source: "{{ dotfiles_root }}/config/user/desktop-shell/current/elephant/desktopapplications.toml"

desktop_shell_current_expected_waybar_entries:
  - config.jsonc
  - config.jsonc.bkp
  - style.css
  - style.css.bkp
desktop_shell_current_expected_elephant_entries:
  - desktopapplications.toml
  - menus
