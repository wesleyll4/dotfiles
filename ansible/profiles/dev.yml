dotfiles_profile_name: dev
profile_roles:
  - common
  - cli_tools
  - shell_zsh

cli_tools_link_mappings:
  - target: "{{ dotfiles_home }}/.config/starship.toml"
    expected_source: "{{ dotfiles_root }}/config/user/starship/starship.toml"
    legacy_sources: []
  - target: "{{ dotfiles_home }}/.config/mise/config.toml"
    expected_source: "{{ dotfiles_root }}/config/user/mise/config.toml"
    legacy_sources: []
  - target: "{{ dotfiles_home }}/.config/yazi/keymap.toml"
    expected_source: "{{ dotfiles_root }}/config/user/yazi/keymap.toml"
    legacy_sources: []

shell_zsh_expected_source: "{{ dotfiles_root }}/config/user/zsh/.zshrc"
shell_zsh_legacy_sources:
  - "{{ dotfiles_root }}/zsh/.zshrc"
shell_zsh_packages: []
