dotfiles_profile_name: dev
profile_roles:
  - common
  - cli_tools
  - shell_zsh
  - terminal_kitty
  - development

cli_tools_link_mappings:
  - target: "{{ dotfiles_home }}/.config/starship.toml"
    expected_source: "{{ dotfiles_root }}/config/user/starship/starship.toml"
    legacy_sources: []
  - target: "{{ dotfiles_home }}/.config/mise/config.toml"
    expected_source: "{{ dotfiles_root }}/config/user/mise/config.toml"
    legacy_sources: []
  - target: "{{ dotfiles_home }}/.config/yazi/keymap.toml"
    expected_source: "{{ dotfiles_root }}/config/user/yazi/keymap.toml"
    legacy_sources: []

shell_zsh_expected_source: "{{ dotfiles_root }}/config/user/zsh/.zshrc"
shell_zsh_legacy_sources: []
shell_zsh_packages: []

terminal_kitty_packages: []
terminal_kitty_entries:
  - name: "One Dark.conf"
    expected_source: "{{ dotfiles_root }}/config/user/kitty/One Dark.conf"
    legacy_sources: []
  - name: current-theme.conf
    expected_source: "{{ dotfiles_root }}/config/user/kitty/current-theme.conf"
    legacy_sources: []
  - name: kitty.conf
    expected_source: "{{ dotfiles_root }}/config/user/kitty/kitty.conf"
    legacy_sources: []
  - name: kitty.conf.bak
    expected_source: "{{ dotfiles_root }}/config/user/kitty/kitty.conf.bak"
    legacy_sources: []
