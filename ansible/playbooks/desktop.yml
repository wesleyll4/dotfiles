- name: Provision desktop profile
  hosts: local
  gather_facts: true
  vars_files:
    - ../profiles/desktop.yml
  pre_tasks:
    - name: Validate selected Arch platform
      ansible.builtin.include_role:
        name: platform_arch
  tasks:
    - name: Compose selected desktop roles
      ansible.builtin.include_role:
        name: "{{ profile_role }}"
      loop: "{{ profile_roles }}"
      loop_control:
        loop_var: profile_role
