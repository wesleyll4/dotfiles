---
- name: Assert managed-link interface
  ansible.builtin.assert:
    that:
      - dotfiles_root is match('^/')
      - dotfiles_home is match('^/')
      - managed_link_expected_source is match('^/')
      - managed_link_legacy_sources is sequence
      - managed_link_legacy_sources is not string
      - managed_link_target is match('^/')
    fail_msg: managed-link paths must be absolute and legacy sources must be a list

- name: Resolve dotfiles root canonically
  ansible.builtin.command:
    argv:
      - realpath
      - --canonicalize-existing
      - "{{ dotfiles_root }}"
  register: managed_link_dotfiles_root
  changed_when: false
  check_mode: false

- name: Resolve dotfiles home canonically
  ansible.builtin.command:
    argv:
      - realpath
      - --canonicalize-existing
      - "{{ dotfiles_home }}"
  register: managed_link_dotfiles_home
  changed_when: false
  check_mode: false

- name: Assert canonical execution roots
  ansible.builtin.assert:
    that:
      - managed_link_dotfiles_root.stdout == dotfiles_root
      - managed_link_dotfiles_home.stdout == dotfiles_home
    fail_msg: dotfiles_root and dotfiles_home must be canonical existing paths

- name: Combine expected and legacy sources
  ansible.builtin.set_fact:
    managed_link_sources: "{{ [managed_link_expected_source] + managed_link_legacy_sources }}"

- name: Resolve managed-link sources canonically
  ansible.builtin.command:
    argv:
      - realpath
      - --canonicalize-existing
      - "{{ item }}"
  loop: "{{ managed_link_sources }}"
  register: managed_link_resolved_sources
  changed_when: false
  check_mode: false

- name: Assert canonical sources remain inside the repository
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.item == item.stdout
      - item.stdout == managed_link_dotfiles_root.stdout or item.stdout.startswith(managed_link_dotfiles_root.stdout + '/')
    fail_msg: managed-link expected and legacy sources must be canonical paths inside dotfiles_root
  loop: "{{ managed_link_resolved_sources.results }}"

- name: Resolve managed-link target parent canonically
  ansible.builtin.command:
    argv:
      - realpath
      - --canonicalize-existing
      - "{{ managed_link_target | dirname }}"
  register: managed_link_target_parent
  changed_when: false
  check_mode: false

- name: Assert canonical target location is inside dotfiles_home
  ansible.builtin.assert:
    that:
      - managed_link_target == managed_link_target_parent.stdout + '/' + (managed_link_target | basename)
      - managed_link_target_parent.stdout == managed_link_dotfiles_home.stdout or managed_link_target_parent.stdout.startswith(managed_link_dotfiles_home.stdout + '/')
    fail_msg: managed-link target must have a canonical existing parent inside dotfiles_home

- name: Inspect existing managed-link target without following it
  ansible.builtin.stat:
    path: "{{ managed_link_target }}"
    follow: false
  register: managed_link_target_state

- name: Resolve existing symlink target canonically
  ansible.builtin.command:
    argv:
      - realpath
      - --canonicalize-existing
      - "{{ managed_link_target }}"
  register: managed_link_resolved_target
  changed_when: false
  failed_when: false
  check_mode: false
  when: managed_link_target_state.stat.islnk | default(false)

- name: Assert managed-link target is absent or explicitly approved
  ansible.builtin.assert:
    that:
      - >-
        (not (managed_link_target_state.stat.exists | default(false)) and
         not (managed_link_target_state.stat.islnk | default(false))) or
        ((managed_link_target_state.stat.islnk | default(false)) and
         (managed_link_resolved_target.stdout | default('')) == managed_link_resolved_sources.results[0].stdout) or
        ((managed_link_target_state.stat.islnk | default(false)) and
         (managed_link_resolved_target.stdout | default('')) in
         (managed_link_resolved_sources.results[1:] | map(attribute='stdout') | list))
    fail_msg: managed-link target is not absent, expected, or an approved legacy symlink

- name: Record approved legacy source before relinking
  ansible.builtin.set_fact:
    managed_link_recorded_legacy_source: "{{ managed_link_resolved_target.stdout }}"
  when:
    - managed_link_target_state.stat.islnk | default(false)
    - managed_link_resolved_target.stdout | default('') in (managed_link_resolved_sources.results[1:] | map(attribute='stdout') | list)

- name: Remove verified legacy symlink
  ansible.builtin.file:
    path: "{{ managed_link_target }}"
    state: absent
  when: managed_link_recorded_legacy_source is defined

- name: Create expected managed-link target
  ansible.builtin.file:
    src: "{{ managed_link_expected_source }}"
    dest: "{{ managed_link_target }}"
    state: link
    follow: false
  when: >-
    (not (managed_link_target_state.stat.exists | default(false)) and
     not (managed_link_target_state.stat.islnk | default(false))) or
    managed_link_recorded_legacy_source is defined
