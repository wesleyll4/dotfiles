---
- name: Assert development package boundary is an explicit list
  ansible.builtin.assert:
    that:
      - development_packages is sequence
      - development_packages is not string
    fail_msg: development_packages must be an explicit reviewed native-package list

- name: Keep development package installation behind the reviewed boundary
  ansible.builtin.include_role:
    name: packages
  vars:
    package_names: "{{ development_packages }}"
  when: development_packages | length > 0
